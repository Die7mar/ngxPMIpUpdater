services:
  ngx-pm-ip-updater:
    build:
      context: ./ngxPMIpUpdater
      dockerfile: Dockerfile
      # Basis-Image bei jedem Build neu holen – sonst bleibt ein einmal geladenes .NET-Image
      # ohne Sicherheitspatches liegen, obwohl das Dockerfile dem gleitenden 10.0-Tag folgt
      pull: true
    container_name: ngx-pm-ip-updater
    restart: unless-stopped
    environment:
      - AppSettings__IntervalMinutes=${INTERVAL_MINUTES:-60}

      # Domains – beliebig viele, mit Komma getrennt
      - AppSettings__Domains__0=${DOMAINS}

      # Statische IP-Blöcke – beliebig viele, mit Komma getrennt
      - AppSettings__StaticIpBlocks__0=${STATIC_IPS}
      - AppSettings__AllowOpenBlocks=${ALLOW_OPEN_BLOCKS:-false}

      # AAAA-Records mitnehmen (als /128). Standard aus – Privacy Extensions lassen
      # eine /128-Regel bei vielen Heimanschlüssen schnell veralten.
      - AppSettings__ResolveIPv6=${RESOLVE_IPV6:-false}

      # Wie lange (in Stunden) die letzte gute IP einer Domain bei DNS-Ausfall weiterverwendet wird
      - AppSettings__FallbackMaxAgeHours=${FALLBACK_MAX_AGE_HOURS:-72}

      # NPM Verbindung
      - AppSettings__Npm__BaseUrl=${NPM_BASE_URL}
      - AppSettings__Npm__ApiToken=${NPM_API_TOKEN}
      - AppSettings__Npm__Email=${NPM_EMAIL}
      - AppSettings__Npm__Password=${NPM_PASSWORD}
      - AppSettings__Npm__AccessListId=${NPM_ACCESS_LIST_ID:-0}

      # Cloudflare Tunnel (optional) – Access Group, deren IP-Regeln gepflegt werden
      - AppSettings__Cloudflare__AccountId=${CF_ACCOUNT_ID:-}
      - AppSettings__Cloudflare__AccessGroupId=${CF_ACCESS_GROUP_ID:-}
      - AppSettings__Cloudflare__ApiToken=${CF_API_TOKEN:-}

      # Benachrichtigungen (optional) – leer lassen zum Deaktivieren
      - AppSettings__Notifications__Url=${NOTIFY_URL:-}
      - AppSettings__Notifications__Type=${NOTIFY_TYPE:-ntfy}
      - AppSettings__Notifications__Token=${NOTIFY_TOKEN:-}
      - AppSettings__Notifications__NotifyOnChange=${NOTIFY_ON_CHANGE:-true}

      # Sicherer als NPM_API_TOKEN: Umgebungsvariablen sind über "docker inspect" und
      # /proc/<pid>/environ für jeden Prozess im Container lesbar. Zum Aktivieren den
      # secrets-Block unten einkommentieren und NPM_API_TOKEN leer lassen.
      # - AppSettings__Npm__ApiTokenFile=/run/secrets/npm_api_token
      # Dasselbe für den Cloudflare-Token; CF_API_TOKEN dann leer lassen:
      # - AppSettings__Cloudflare__ApiTokenFile=/run/secrets/cf_api_token
      # Dasselbe für eine Discord-Webhook-URL (enthält ihr eigenes Geheimnis); NOTIFY_URL dann leer lassen:
      # - AppSettings__Notifications__UrlFile=/run/secrets/notify_url

    # Speichert die letzten erfolgreich aufgelösten IPs. Ohne dieses Volume verliert der
    # Aussperr-Schutz bei einem Container-Restart seine Historie.
    volumes:
      - ngx-pm-ip-updater-state:/data

    # Muss dasselbe Netz sein, in dem NPM läuft – sonst ist http://nginx-proxy-manager:81 nicht auflösbar.
    # Nur mit Cloudflare (ohne NPM) diesen Block und den networks-Block ganz unten entfernen.
    networks:
      - npm

    # secrets:
    #   - npm_api_token
    #   - cf_api_token
    #   - notify_url

volumes:
  ngx-pm-ip-updater-state:

networks:
  npm:
    external: true
    name: ${NPM_NETWORK_NAME:-nginx-proxy-manager_default}

